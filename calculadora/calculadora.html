<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="stylesheet" href="css/calculadora.css">
        <script src="js/calculador.js" defer></script>
    </head>

    <body>
        <main class="calculadora">
            <h1>Calculadora</h1>
            <table class="teclado">
                <tbody>
                <tr>
                    <td colspan="4"><input type="text" id="pantalla" value="0" readonly aria-label="Pantalla de la calculadora"></td>
                </tr>
                <tr>
                    <td><button type="button" onclick="escribir('7')">7</button></td>
                    <td><button type="button" onclick="escribir('8')">8</button></td>
                    <td><button type="button" onclick="escribir('9')">9</button></td>
                    <td><button type="button" onclick="escribir('/')">÷</button></td>
                </tr>
                <tr>
                    <td><button type="button" onclick="escribir('4')">4</button></td>
                    <td><button type="button" onclick="escribir('5')">5</button></td>
                    <td><button type="button" onclick="escribir('6')">6</button></td>
                    <td><button type="button" onclick="escribir('*')">×</button></td>
                </tr>
                <tr>
                    <td><button type="button" onclick="escribir('1')">1</button></td>
                    <td><button type="button" onclick="escribir('2')">2</button></td>
                    <td><button type="button" onclick="escribir('3')">3</button></td>
                    <td><button type="button" onclick="escribir('-')">−</button></td>
                </tr>
                <tr>
                    <td><button type="button" onclick="escribir('0')">0</button></td>
                    <td><button type="button" onclick="escribir('.')">.</button></td>
                    <td><button type="button" onclick="calcular()">=</button></td>
                    <td><button type="button" onclick="escribir('+')">+</button></td>
                </tr>
                <tr>
                    <td colspan="4"><button type="button" onclick="borrar()">C</button></td>
                </tr>
                </tbody>
            </table>
            <p class="volver"><a href="../index.html">Volver al inicio</a></p>
        </main>
    </body>
</html>
